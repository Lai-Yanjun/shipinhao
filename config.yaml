# 栏目身份：改这里就能整体换皮，模板不用动
brand:
  masthead: "极地档案"
  masthead_en: "POLAR ARCHIVES"
  column: "远征灾难档案"
  issue: 1                 # 每期递增，制造连载感

visual:
  paper: "#FAFAF8"         # 内页纸白
  ink: "#141414"           # 正文墨色
  accent: "#1B6B8C"        # 点缀冰蓝（案例用橙，极地题材换冷调）
  muted: "#8A8A85"         # 图注灰
  cover_bg: "#0E1418"      # 封面深底

video:
  width: 1080
  height: 1920
  fps: 30
  cover_sec: 3.2           # 封面停留
  # 内页停留按字数推算：观众是扫读不是逐字读，11 字/秒接近实测上限
  reading_cps: 11.0
  page_pad_sec: 1.2        # 每页的进出缓冲
  page_min_sec: 3.5        # 再短的页面也要给这么久
  transition_sec: 0.45     # 翻页转场
  ken_burns: 0.05          # 每页缓慢推镜幅度，0 则完全静止
