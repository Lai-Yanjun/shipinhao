# 极地与远征灾难选题池
#
# risk 说明：
#   低 = 年代久远、已结案、无在世当事人被指控、素材多为公有领域 —— 可直接做
#   中 = 有争议、有在世家属，或案件仍未结 —— 可做，但文案必须更克制，只陈述官方记录
#   高 = 不建议现阶段做
#
# 每条落地前都要走 docs/compliance.md 的素材授权登记，note 里的信源方向只是起点，不是结论。

topics:
  - title: 安德烈北极气球远征
    year: 1897
    region: 瑞典 · 白岛
    risk: 低
    note: >-
      三人乘氢气球飞往北极失踪，33 年后在白岛发现遗骸与未冲洗的底片；
      底片冲洗后还原出他们最后的影像。1897 年拍摄，素材公有领域，视觉极强。开栏首选。

  - title: 富兰克林远征
    year: 1845
    region: 加拿大 · 北极群岛
    risk: 低
    note: >-
      HMS Erebus 与 Terror 载 129 人驶入北极，全员失踪；
      后续在遗骨中检出异常铅含量，2014 与 2016 年先后找到两艘沉船。
      素材：19 世纪版画（PD）+ 加拿大公园管理局公开的水下影像（需核对授权条款）。

  - title: 斯科特南极远征
    year: 1912
    region: 南极 · 罗斯冰架
    risk: 低
    note: >-
      抵达南极点发现阿蒙森已先到，返程途中五人全部遇难，日记留存至最后一天。
      随队摄影师 Herbert Ponting 的作品为公有领域，画质好、数量多。

  - title: 卡卢克号沉没
    year: 1913
    region: 加拿大 · 北极
    risk: 低
    note: 探险船被浮冰困住后压沉，队长弃船离队，最终 11 人死亡。争议点在于弃船决定。

  - title: 切柳斯金号与浮冰营地
    year: 1934
    region: 苏联 · 楚科奇海
    risk: 低
    note: 货轮被冰压沉，104 人在浮冰上扎营两个月，由苏联空军分批营救。苏联官方影像充足。

  - title: 北极浮冰漂流站 SP-1
    year: 1937
    region: 苏联 · 北冰洋
    risk: 低
    note: 四人在一块浮冰上漂流 274 天，冰块持续碎裂缩小。苏联官方摄影素材多。

  - title: 拜尔德独自越冬
    year: 1934
    region: 南极 · 前进基地
    risk: 低
    note: 独自在冰下小屋越冬数月，因取暖设备一氧化碳中毒濒死，日记记录了神志变化过程。

  - title: 利科夫一家
    year: 1978
    region: 苏联 · 西伯利亚泰加林
    risk: 低
    note: >-
      一家六口 1936 年遁入泰加林，与世隔绝 42 年，1978 年被地质勘探队偶然发现，
      不知道二战发生过。不是灾难题材但同属"极地生存"，适合做节奏调剂。

  - title: 坚忍号
    year: 1915
    region: 南极 · 威德尔海
    risk: 低
    note: >-
      船被浮冰压碎，28 人在冰上与海上辗转近两年全部生还。
      作为"反转期"用 —— 连续多期灾难后放一期全员生还，账号情绪节奏才立得住。

  - title: 罗戈佐夫自我手术
    year: 1961
    region: 南极 · 新拉扎列夫站
    risk: 低
    note: 越冬站唯一的医生患急性阑尾炎，在两名非医务人员协助下给自己做了手术。

  - title: 幽灵船贝丘莫号
    year: 1931
    region: 北冰洋 · 阿拉斯加外海
    risk: 低
    note: 被冰困后弃船，此后近 40 年间被多次目击仍在漂流。素材偏少，需要更多档案图支撑。

  - title: 世纪营地
    year: 1959
    region: 格陵兰 · 冰盖之下
    risk: 中
    note: >-
      在格陵兰冰盖下开凿的核动力军事基地，对外以冰芯研究为名，1967 年废弃；
      冰盖消融使遗留废弃物重新成为议题。已完全解密，但涉及两国外交，只陈述已公开事实。

  - title: 冰谷女尸
    year: 1970
    region: 挪威 · 卑尔根
    risk: 中
    note: >-
      身份至今未确认，衣物标签被全部剪除，持多本不同姓名的证件。
      案件未结，但无在世当事方被指控。文案只用挪威警方公开档案的记录用词。

  - title: 马洛里与欧文
    year: 1924
    region: 中国/尼泊尔 · 珠穆朗玛峰
    risk: 中
    note: >-
      两人在冲顶途中失踪，是否登顶至今无定论；1999 年找到马洛里遗体。
      近年关于欧文遗骸与相机的报道有新进展，落地前必须核实最新公开信息。

  - title: 埃里伯斯山空难
    year: 1979
    region: 南极 · 埃里伯斯山
    risk: 中
    note: >-
      南极观光航班撞山，257 人罹难，两次官方调查结论存在重大分歧。
      有在世家属，只讲调查结论的分歧本身，不做任何责任归因。

  - title: 1996 年珠峰山难
    year: 1996
    region: 尼泊尔 · 珠穆朗玛峰
    risk: 高
    note: >-
      当事人多数在世且对经过各执一词，公开争论持续至今。
      现阶段不建议做 —— 任何叙述都可能被视为选边。
